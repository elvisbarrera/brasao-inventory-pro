<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brasão Inventory Pro</title>
    <meta name="description" content="A mobile-first inventory management application for wine bars with dedicated counting modes for cellar and bar service areas, featuring AI-powered OCR for handwritten sheets.">
    <meta property="og:title" content="Brasão Inventory Pro">
    <meta property="og:description" content="A mobile-first inventory management application for wine bars with dedicated counting modes for cellar and bar service areas, featuring AI-powered OCR for handwritten sheets.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              playfair: ['"Playfair Display"', 'Georgia', 'serif'],
              cormorant: ['"Cormorant Garamond"', 'Garamond', 'serif'],
              montserrat: ['Montserrat', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .font-playfair { font-family: 'Playfair Display', Georgia, serif; }
        .font-cormorant { font-family: 'Cormorant Garamond', Garamond, serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8f9fb;
        }
        input, select, button {
            font-size: 16px !important; /* Prevents iOS zoom on focus */
        }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
